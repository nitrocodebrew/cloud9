<!DOCTYPE html>
<html lang="en-US">
<head>

    <meta charset="UTF-8">

    <title>Cloud9: Weather Report</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Weather application created with JavaScript, asynchronous programming techniques, and Open-Meteo API.">
    <meta name="robots" content="index, follow">

    <script src="index.js" type="module"></script>

</head>
<body>
    <header class="header">
        <div class="container header-container">
            <form id="location-search-form">
                <label for="location-search">Find your city</label>
                <input type="search" id="location-search" placeholder="Search for a city..."> 
            </form>
            <div class="search-suggestions" hidden>
            </div>
            <div class="open-prefs">
                <button type="button" class="preferences-button">⚙ Preferences</button>
            </div>
            <dialog class="preferences-dialog">
                <form method="dialog">
                    <div class="preferences-dialog-header">
                        <h2>Preferences</h2>

                        <button type="submit" class="preferences-close-button" aria-label="Close preferences">&times;</button>
                    </div>
                </form>

                <div class="preferences-dialog-content">
                    <fieldset class="unit-toggle">
                        <legend>Temperature</legend>

                        <button type="button" class="unit-button use-celsius" data-unit="metric">Celsius</button>
                        <button type="button" class="unit-button use-fahrenheit" data-unit="us">Fahrenheit</button>
                    </fieldset>

                    <fieldset class="time-toggle">
                        <legend>Time Format</legend>

                        <button type="button" class="time-format-button use-24" data-time-format="24">24 Hour</button>
                        <button type="button" class="time-format-button use-12" data-time-format="12">12 Hour</button>
                    </fieldset>
                </div>
            </dialog>
        </div>
    </header>
    <main class="weather-report">
        <div class="container weather-report-container">

        <div class="weather-status" role="status" aria-live="polite">
            Search for a city to see the weather report.
        </div>
        <div class="weather-container" hidden>
                <section class="current-weather-details">
                    <h1 class="location-name"></h1>

                    <div class="set-default-location">
                        <button type="button" class="default-location-button" hidden>☆ Set as Default Location</button>
                    </div>
                    <div class="current-weather-forecast">
                        <div class="current-weather-forecast-detail">
                            <h2 class="current-weather-forecast-headline">Temperature</h2>
                            <div class="current-temperature-details">
                                <span class="current-temp"></span>
                                <small>Feels Like</small>
                                <span class="current-apparent-temp"></span>
                            </div>
                        </div>
                        <div class="current-weather-forecast-detail">
                            <h2 class="current-forecast-detail-headline">Wind</h2>
                            <span class="current-wind"></span>
                            <span class="current-wind-direction"></span>
                        </div>
                        <div class="current-weather-forecast-detail">
                            <h2 class="current-forecast-detail-headline">Conditions</h2>
                            <span class="current-conditions"></span>
                        </div>
                    </div>
                </section>
                <section class="hourly-forecast">
                    <h2>Hourly</h2>
                    <ul>
                        
                    </ul>
                </section>
                <section class="additional-weather-data">
                    <h2>Additional Weather Data</h2>
                    <dl>
                        <div class="additional-data-cell">
                            <dt>Sunrise</dt>
                            <dd class="additional-sunrise"></dd>
                        </div>
                        <div class="additional-data-cell">
                            <dt>Sunset</dt>
                            <dd class="additional-sunset"></dd>
                        </div>
                        <div class="additional-data-cell">
                            <dt>Humidity</dt>
                            <dd class="additional-humidity"></dd>
                        </div>
                        <div class="additional-data-cell">
                            <dt>Visibility</dt>
                            <dd class="additional-visibility"></dd>
                        </div>
                    </dl>
                </section>
            </div>
        </div>
    </main>
    <footer class="footer">
        <div class="container footer-container">
            <p>
                The source code for this project can be found on <a href="https://github.com/nitrocodebrew/cloud9" target="_blank" rel="noopener noreferrer" class="github-repo-link">GitHub</a>.
            </p>
        </div>
    </footer>
</body>
</html>
