<!DOCTYPE html>
<html lang="en-US">
<head>

    <meta charset="UTF-8">

    <title>Cloud9: Weather Report</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Weather application created with JavaScript, asynchronous programming techniques, and Open-Meteo API.">
    <meta name="robots" content="index, follow">

    <script src="index.js" type="module"></script>

</head>
<body>
    <header class="header">
        <div class="container header-container">
            <form id="location-search-form">
                <label for="location-search">Find your city</label>
                <input type="search" id="location-search" placeholder="Search for a city..."> 
                <button type="button" class="location-search-btn">Find</button>
            </form>
            <div class="search-suggestions">

            </div>
        </div>
    </header>
    <main class="weather-report">
        <div class="container weather-report-container">
            <section class="current-weather-details">
                <h1 class="location-name"></h1>
                <dl>
                    <div class="current-row">
                        <dt>Temperature</dt>
                        <dd class="current-temp"></dd>
                    </div>
                    <div class="current-row">
                        <dt>Feels Like</dt>
                        <dd class="current-apparent-temp"></dd>
                    </div>
                    <div class="current-row">
                        <dt>Conditions</dt>
                        <dd class="current-conditions"></dd>
                    </div>
                    <div class="current-row">
                        <dt>Wind</dt>
                        <dd class="current-wind"></dd>
                    </div>
                </dl>
            </section>
            <section class="hourly-forecast">
                <dl>

                </dl>
            </section>
        </div>
    </main>
    <footer class="footer">
        <div class="container footer-container">
            <p>
                The source code for this project can be found on <a href="https://github.com/nitrocodebrew/cloud9" target="_blank" rel="noopener noreferrer" class="github-repo-link">GitHub</a>.
            </p>
        </div>
    </footer>
</body>
</html>
